name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install client
        run: python -m pip install ./client
      - name: Compile
        run: python -m compileall -q client/src client/tests
      - name: Unit and mock integration tests
        run: python -m unittest discover -s client/tests -t client -v
      - name: CLI smoke test
        run: ymatter --help
      - name: Build wheel
        run: python -m pip wheel ./client --no-deps -w dist

  research-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: PowerShell AST and production mock harness
        shell: pwsh
        run: ./tests/run_full_matter_controller_audit.ps1
      - name: Remote lifecycle shell model
        run: python tests/test_maind_http_remote_lifecycle_shell.py
      - name: Inventory production contracts
        run: python tests/test_inventory_production_contracts.py
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = @(Get-ChildItem scripts,tests -Recurse -File -Include *.ps1,*.psm1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error })
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer reported errors" }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck and BusyBox
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck busybox
      - name: Shell syntax
        run: |
          find scripts client/station tests -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: ShellCheck
        run: |
          find scripts client/station tests -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/check_publication_safety.py
      - run: python tools/check_markdown_links.py
